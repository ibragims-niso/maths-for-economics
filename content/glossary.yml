# Canonical terms. Extend as topics are written. Used by content and AI prompts.
marginal cost: The extra cost of producing one more unit; the derivative of total cost with respect to output.
marginal revenue: The extra revenue from selling one more unit; the derivative of total revenue with respect to output.
price elasticity of demand: Percentage change in quantity demanded divided by percentage change in price.
equilibrium: A situation where quantity supplied equals quantity demanded, so price has no tendency to change.
present value: The value today of an amount received in the future, discounted at a given interest rate.
shadow price: The change in the optimal value of an objective when a constraint is relaxed by one unit; the Lagrange multiplier.
returns to scale: How output changes when all inputs are scaled by the same factor.
exponent: The number n in xⁿ that says how many times the base x is multiplied by itself; zero, negative and fractional exponents extend this to 1, reciprocals and roots.
fractional exponent: A power p/q, meaning take the q-th root and then raise to the power p, so x^(1/2) = √x.
factorising: Rewriting a sum as a product by taking out a common factor, for example PQ − vQ = (P − v)Q.
Cobb–Douglas production function: A production function Q = A·K^α·L^β in which output depends on capital K and labour L raised to fixed powers, with A measuring productivity.
break-even point: The output at which revenue equals total cost, so profit is zero.
budget constraint: The condition that spending on all goods cannot exceed the budget, for example p_x·x + p_y·y ≤ M.
discriminant: For ax² + bx + c = 0, the number b² − 4ac; positive means two solutions, zero means one, negative means none.
quadratic formula: The solutions of ax² + bx + c = 0, x = (−b ± √(b² − 4ac))/(2a).
domain: The set of inputs for which a function is defined; in economics it is often limited further to non-negative prices and quantities.
range: The set of output values a function takes over its domain.
piecewise function: A function that uses different formulas on different intervals of its input, such as an income tax with bands.
fixed cost: The part of total cost that does not change with output, equal to the cost of producing nothing, C(0).
marginal tax rate: The tax rate paid on the next unit of income; in a banded tax it is the rate of the band the income falls in.
parabola: The hill- or valley-shaped graph of a quadratic function y = ax² + bx + c.
vertex: The highest or lowest point of a parabola, at x = −b/(2a).
axis of symmetry: The vertical line through the vertex of a parabola; points the same distance either side of it have the same height.
inverse demand curve: Demand written with price as a function of quantity, P = α − βQ, giving the price at which a quantity can be sold.
growth factor: The number a value is multiplied by each period; with a growth rate g it is 1 + g.
natural logarithm: The logarithm to base e (about 2.718), written ln x; the power to which e must be raised to give x.
rule of 70: A quick estimate of doubling time; 70 divided by the growth rate in per cent.
average annual growth rate: The constant yearly rate that takes a value from its starting level to its final level over T years, (end ÷ start)^(1/T) − 1.
log-linear model: A model in which the logarithm of a variable is a linear function of other variables, so its coefficients read as approximate percentage changes.
arithmetic sequence: A list of numbers in which each term is the previous one plus a fixed amount, the common difference.
geometric sequence: A list of numbers in which each term is the previous one multiplied by a fixed number, the common ratio.
series: The sum of the terms of a sequence, such as total earnings over several years.
convergent series: A series whose running total settles at a fixed number as more and more terms are added.
composite function: A function made by applying one function to the output of another, written f(g(x)) or (f ∘ g)(x).
inverse function: The function that undoes another, taking each output back to the input that produced it; it exists only when the original function is one-to-one.
one-to-one function: A function in which different inputs always give different outputs, so every horizontal line meets its graph at most once.
annuity: A series of equal payments made at regular intervals for a fixed number of periods.
perpetuity: A series of equal payments that continues for ever; its present value is the payment divided by the interest rate.
annuity due: An annuity whose payments are made at the start of each period rather than at the end.
annuity factor: The number (1 − (1 + r)^(−n))/r that turns one period's payment into the present value of n such payments.
Gordon growth model: A way of valuing a share as next year's dividend divided by the required return minus the constant growth rate of dividends.
set: A collection of objects, called elements, with a clear rule for whether something belongs to it.
budget set: All bundles of goods a consumer can afford at given prices and income.
inclusion–exclusion principle: To count the members of overlapping groups, add the group sizes, subtract the overlaps counted twice and add back anything removed too often.
sufficient condition: In "if S then T", S is a sufficient condition for T; whenever S holds, T holds.
necessary condition: In "if S then T", T is a necessary condition for S; S cannot hold unless T does.
marginal propensity to consume: The share of an extra unit of income that households spend on consumption.
spending multiplier: The change in equilibrium national income caused by a one-unit change in autonomous spending, such as government spending or investment.
marginal propensity to import: The share of an extra unit of income that is spent on imported goods.
monetary base: The cash held by the public plus the reserves banks hold; the money the central bank creates directly.
money multiplier: The change in the money supply caused by a one-unit change in the monetary base.
nominal annual rate: The quoted yearly interest rate, equal to the rate per period times the number of periods in a year, before the effect of compounding.
effective annual rate: The interest actually earned or paid over one year once compounding is counted, (1 + r/m)^m − 1.
continuous compounding: Adding interest at every instant, so that a sum grows by the factor e^(rt) over t years.
discounting: Converting a future amount into its value today by dividing by (1 + r) for each period until it is paid.
discount factor: The value today of one unit of money paid in n periods, 1/(1 + r)^n; it lies between 0 and 1 when the rate is positive.
discount rate: The interest rate used to convert future amounts into present values.
real interest rate: The interest rate after allowing for inflation; approximately the nominal rate minus the inflation rate (the Fisher approximation).
vector: An ordered list of numbers, such as the quantities of each good in a bundle, where the position of each entry says what it measures.
dot product: The number p·x = p₁x₁ + … + pₙxₙ obtained by multiplying matching entries of two vectors and adding; with prices and quantities it is the cost of a bundle.
norm: The length of a vector, ‖x‖ = √(x₁² + … + xₙ²); the norm of x − y is the distance between x and y.
orthogonal: Two vectors are orthogonal (at a right angle) when their dot product is zero.
consumption bundle: A vector listing how many units of each good a consumer buys.
limit: The value a function's output gets closer and closer to as its input approaches a given number or grows without bound.
one-sided limit: The value a function approaches when its input comes towards a point from one side only, from below (left) or from above (right).
continuous function: A function whose graph has no holes, jumps or breaks at a point, so that its value there equals its limit there.
jump discontinuity: A point where the limits from the left and from the right both exist but are different, so the graph jumps.
asymptote: A line that a graph gets ever closer to without reaching it, for example average cost approaching marginal cost as output grows.
average rate of change: The change in a function's value divided by the change in its input, Δy/Δx; the slope of the secant line through two points of its graph.
difference quotient: The fraction (f(x + h) − f(x))/h, the average rate of change of f over a step of size h.
derivative: The limit of the difference quotient as h shrinks to 0, written f′(x) or dy/dx; the instantaneous rate of change and the slope of the tangent.
tangent line: The straight line that touches a curve at a point and has the same slope as the curve there, y = f(a) + f′(a)(x − a).
differentiable: Having a derivative at a point, which needs the slopes from the left and from the right to agree; a corner or kink is not differentiable.
matrix: A rectangular table of numbers arranged in rows and columns, such as the sales of each shop (rows) of each good (columns).
matrix product: The matrix AB whose entry in row i and column j is row i of A times column j of B; it exists only when A has as many columns as B has rows.
transpose: The matrix Aᵀ obtained by turning the rows of A into columns, so (Aᵀ)ᵢⱼ = aⱼᵢ.
identity matrix: A square matrix with 1s on the main diagonal and 0s elsewhere; multiplying by it leaves any matrix unchanged.
transition matrix: A square matrix of probabilities of moving from one state (row) to another (column) in one period; each row adds up to 1.
power rule: The derivative of xⁿ is n·xⁿ⁻¹, for any real power n, including negative and fractional ones.
product rule: The derivative of a product u·v is u′v + uv′, not u′v′.
quotient rule: The derivative of u/v is (u′v − uv′)/v², where v is not zero.
average cost: Total cost divided by output, C(Q)/Q; it falls while marginal cost is below it and rises once marginal cost is above it.
chain rule: The rule for differentiating a composite function, where the derivative of f(g(x)) is f′(g(x)) times g′(x).
inner function: In a composite f(g(x)), the function g that acts first; its output is the input of the outer function f.
marginal product of labour: The extra output from employing one more worker; the derivative of output with respect to labour.
marginal revenue product of labour: The extra revenue from employing one more worker, equal to marginal revenue times the marginal product of labour.
growth rate: The slope of a variable divided by its level, ẏ/y, which equals the derivative of ln y with respect to time.
log difference: The change in the natural log of a variable, ln y₁ − ln y₀; close to the percentage change when the change is small.
total factor productivity: The part of output not explained by measured inputs, the A in Y = A·K^α·L^(1−α).
growth accounting: Splitting output growth into the contributions of capital, labour and the growth of total factor productivity.
logarithmic differentiation: Differentiating a function by first taking its logarithm, which turns products and powers into sums.
determinant: A single number computed from a square matrix; its absolute value is the factor by which the matrix scales areas, and it is zero exactly when the matrix has no inverse.
cofactor: The minor of a matrix entry (the determinant left after deleting its row and column), multiplied by +1 or −1 according to the chessboard sign pattern.
Cramer's rule: A formula giving each unknown of a square linear system with non-zero determinant as det A_j / det A, where A_j is A with column j replaced by the right-hand side.
comparative statics: Comparing a model's equilibrium before and after a change in an outside parameter, to see which way and how far each equilibrium value moves.
marginal profit: The change in profit from producing one more unit; marginal revenue minus marginal cost.
diminishing marginal product: The pattern where each extra unit of an input adds less output than the one before, although total output still rises.
average product of labour: Output per worker, total output divided by the number of workers.
implicit differentiation: Finding dy/dx from an equation linking x and y without solving it for y, by differentiating both sides and treating y as a function of x.
indifference curve: All the bundles of two goods that give a consumer the same level of utility.
marginal rate of substitution: How many units of one good a consumer would give up for one more unit of another and stay equally well off; minus the slope of the indifference curve.
isoquant: All the combinations of inputs, such as workers and machines, that produce the same output.
marginal rate of technical substitution: How many units of one input one more unit of another input can replace with output unchanged; minus the slope of the isoquant.
span: The set of all linear combinations of some vectors, everything that can be built from them by scaling and adding.
linear independence: A set of vectors is linearly independent when none of them can be written as a combination of the others, so each adds a new direction.
basis: A set of linearly independent vectors that spans a space, so every vector in it can be built from them in exactly one way.
rank: The number of independent rows (equivalently, columns) of a matrix, found by counting the pivots after Gaussian elimination.
numéraire: The good whose price is set to 1 so that all other prices are measured in units of it.
second derivative: The derivative of the derivative, f″(x); it measures how fast a slope such as marginal cost is itself changing.
concave function: A function whose graph bends downwards, so chords lie below it and its slope keeps falling (f″ ≤ 0).
convex function: A function whose graph bends upwards, so chords lie above it and its slope keeps rising (f″ ≥ 0).
inflection point: A point where a graph changes from concave to convex or back, so the second derivative changes sign there.
diminishing marginal returns: Each extra unit of an input adds less output than the one before, so the marginal product falls.
function of several variables: A rule that gives one number for each list of inputs, such as utility U(x, y) from two goods or output Q(K, L) from capital and labour.
level curve: The set of all input pairs at which a function of two variables takes the same value c, drawn as a curve in the plane.
contour map: A drawing of several level curves of one function; curves close together mean the function changes quickly there.
augmented matrix: The coefficients of a linear system with its right-hand side added as an extra column, one row per equation.
row echelon form: A matrix shape where each row's first non-zero entry (its pivot) lies to the right of the pivot above, with only zeros below every pivot.
pivot: The first non-zero entry of a row in echelon form; elimination divides by it and uses it to clear the entries below.
Gaussian elimination: Solving a linear system by row operations that bring it to row echelon form, followed by back substitution.
free variable: An unknown with no pivot in the echelon form; it can take any value, so the system has infinitely many solutions.
inverse matrix: For a square matrix A, the matrix A⁻¹ with AA⁻¹ = A⁻¹A = I; it exists exactly when det A ≠ 0 and undoes what A does.
singular matrix: A square matrix whose determinant is 0, so it has no inverse and Ax = b has no solution or infinitely many.
adjugate: The transpose of the matrix of cofactors; dividing it by det A gives the inverse, A⁻¹ = adj A / det A.
Gauss–Jordan elimination: Row-reducing [A | I] until the left half is I, at which point the right half is A⁻¹.
linear approximation: Estimating f(a + h) by the tangent line, f(a) + f′(a)h, which works well when the step h is small.
differential: The estimated change dy = f′(x)·dx in a function when its input changes by a small amount dx, such as marginal cost times the change in output.
quadratic approximation: The tangent-line estimate plus the curvature term ½f″(a)h², which follows the bending of the curve and is more accurate for small steps.
Taylor polynomial: The polynomial f(a) + f′(a)h + f″(a)h²/2! + … + f⁽ⁿ⁾(a)hⁿ/n!, which matches a function and its first n derivatives at the point a.
Maclaurin polynomial: A Taylor polynomial about the point 0, such as 1 + x + x²/2 for eˣ.
antiderivative: A function whose derivative is a given function; total cost is an antiderivative of marginal cost.
indefinite integral: The family of all antiderivatives of a function, written ∫f(x) dx = F(x) + C.
constant of integration: The unknown constant added to an antiderivative, fixed by one known value such as the fixed cost C(0).
initial condition: A known starting value of a total, such as the fixed cost or today's capital stock, used to pin down the constant of integration.
net investment: The yearly increase in the capital stock, gross investment minus depreciation, so that K′(t) = I(t).
partial derivative: The rate of change of a function of several variables with respect to one of them while all the others are held fixed, written ∂f/∂x or f_x.
gradient: The vector of a function's partial derivatives, ∇f = (f_x, f_y); it points in the direction of fastest increase and is perpendicular to the level curve.
directional derivative: The rate of change of a function per unit of distance moved in a given direction, D_u f = ∇f·u for a unit vector u.
Young's theorem: For a function with continuous second partial derivatives, the mixed partials are equal, f_xy = f_yx.
marginal utility: The extra utility from one more unit of a good with the amounts of all other goods held fixed.
critical point: A point where every partial derivative of a function is zero; a maximum, a minimum or a saddle point.
Hessian: The square matrix of a function's second partial derivatives; its determinant and leading principal minors decide whether a critical point is a maximum or a minimum.
saddle point: A critical point where the function rises in some directions and falls in others, so it is neither a maximum nor a minimum.
price discrimination: Charging different prices for the same product in separate markets, with higher prices where demand is less elastic.
leading principal minors: The determinants of the top-left 1×1, 2×2, …, n×n blocks of a square matrix.
definite integral: The number obtained by adding up a function over an interval, equal to the limit of Riemann sums and computed as F(b) − F(a) for an antiderivative F.
Riemann sum: An approximation to the area under a curve made by adding the areas of thin rectangles whose heights are values of the function.
Fundamental Theorem of Calculus: The result that the definite integral of f from a to b equals F(b) − F(a) for any antiderivative F of f.
average value of a function: The integral of a function over an interval divided by the length of the interval; the height of a rectangle with the same area.
signed area: Area counted as positive above the horizontal axis and negative below it, which is what a definite integral measures.
integration by substitution: A way to integrate f(g(x))·g′(x) by renaming the inside g(x) as u, so the integral becomes ∫f(u) du; it is the chain rule run backwards.
integration by parts: The rule ∫u dv = uv − ∫v du, the product rule run backwards, used to integrate products such as t·e^(−rt) or ln x.
LIATE: A rough guide for choosing u in integration by parts, in order of preference — logarithms, inverse trigonometric functions, algebraic terms, trigonometric functions, exponentials.
present value of an income stream: The value today of income arriving continuously at rate f(t) for T years, ∫₀ᵀ f(t)·e^(−rt) dt.
willingness to pay: The most a buyer would pay for one more unit of a good; the inverse demand curve shows it unit by unit.
consumer surplus: The total value buyers place on what they buy minus what they pay, the area between the demand curve and the price.
producer surplus: What sellers receive minus the least they would have accepted, the area between the price and the supply curve.
deadweight loss: The fall in total surplus when a tax or price control stops trades that would have benefited both sides.
gains from trade: The total surplus created by a market, consumer surplus plus producer surplus.
improper integral: An integral over an infinite interval, or of a function that becomes infinite at an end of the interval, defined as the limit of ordinary definite integrals.
convergent integral: An improper integral whose limit exists as a finite number, which is then its value.
divergent integral: An improper integral whose limit is infinite or does not exist, so it has no finite value.
continuous income stream: Income received smoothly at a rate per year rather than in separate payments; its present value is the integral of the discounted rate.
continuous discounting: Converting future amounts to today's value with the factor e^(−rt), the reverse of continuous compounding.
solid of revolution: The solid formed by spinning a region of the plane around an axis, such as a tank made by rotating a curve about the x-axis.
arc length: The length of a curve between two points, found by adding up the lengths of tiny, almost straight pieces of it.
line integral: An integral that adds up a quantity along a curve, either a value per unit of length (first kind) or a force times movement (second kind).
path independence: The property that a line integral depends only on where a route starts and ends, not on the route taken between them.
partial sum: The total of the first n terms of a series; the series converges when these totals settle at a fixed number.
divergent series: A series whose running total grows without limit or keeps jumping about, so it has no finite sum.
harmonic series: The series 1 + 1/2 + 1/3 + …, which diverges even though its terms shrink to 0.
power series: An endless polynomial a₀ + a₁(x − c) + a₂(x − c)² + … whose sum depends on x.
radius of convergence: The distance R from the centre of a power series within which the series converges; outside it the series diverges.
double integral: The limit of sums of (value × small area) over a region; for a density it gives the total amount on the region, and for a positive function the volume under its surface.
iterated integral: A double integral computed as two single integrals, the inner one with the other variable held constant.
Fubini's theorem: For a continuous function on a rectangle, the two orders of integration give the same double integral.
joint density: A non-negative function of two variables whose double integral over all values is 1; the probability of a region is its double integral over that region.
sample space: The set of all possible outcomes of an experiment; events are subsets of it.
combination: An unordered choice of k items from n, counted by C(n, k) = n!/(k!(n − k)!).
conditional probability: The probability of A once B is known to have happened, P(A | B) = P(A ∩ B)/P(B).
independent events: Events where knowing one happened does not change the chance of the other, so P(A ∩ B) = P(A)·P(B).
Bayes' theorem: A rule for updating a probability after new evidence, turning P(evidence | A) and the base rate P(A) into P(A | evidence).
random variable: A number whose value depends on the outcome of a random experiment, such as next year's return on a share.
probability mass function: For a discrete random variable, the list of its possible values with the probability of each; the probabilities add up to 1.
cumulative distribution function: F(x) = P(X ≤ x), the probability that a random variable is at most x; it rises from 0 to 1.
expected value: The probability-weighted average of a random variable's values, E[X] = Σ x·p(x); the long-run average if the situation repeats.
standard deviation: The square root of the variance, the expected squared distance from the mean; it measures how far outcomes typically lie from the mean and is the usual measure of risk.
Bernoulli trial: A single random experiment with two outcomes, success with probability p and failure with probability 1 − p.
binomial distribution: The distribution B(n, p) of the number of successes in n independent trials that each succeed with probability p; its mean is np and its variance np(1 − p).
Poisson distribution: The distribution of the number of events in an interval when events occur independently at a steady average rate λ; its mean and variance both equal λ.
Poisson approximation: Using Poisson(np) in place of the binomial B(n, p) when n is large and p is small.
probability density function: A non-negative curve for a continuous random variable whose area between two values is the probability of landing between them; the total area is 1.
normal distribution: The symmetric bell-shaped distribution N(μ, σ²) with mean μ and variance σ², the standard model for returns, measurement errors and many economic quantities.
standard normal distribution: The normal distribution with mean 0 and variance 1, whose cdf Φ(z) is tabulated and used for every normal probability after standardising.
z-score: The distance of a value from the mean in standard deviations, z = (x − μ)/σ.
value-at-risk: The return or loss that an investment falls below or exceeds with only a small stated probability, such as 1 % or 5 % of days.
joint distribution: The probabilities of every pair of values that two random variables can take together, often shown as a table.
marginal distribution: The distribution of one variable on its own, found by adding a joint table along its rows or down its columns.
covariance: A measure of whether two variables tend to be above their means at the same time (positive) or on opposite sides (negative), Cov(X, Y) = E[XY] − E[X]E[Y].
correlation: Covariance divided by both standard deviations, a unit-free number between −1 and 1 that measures how closely two variables move along a straight line.
diversification: Spreading money across assets that do not move in perfect step, so that the portfolio is less risky than the weighted average of its parts.
sampling distribution: The distribution of a statistic, such as a sample mean, over all the random samples that could have been drawn.
standard error: The standard deviation of a statistic; for a sample mean it is σ/√n, so it shrinks as the sample grows.
central limit theorem: The result that the mean (or total) of many independent observations is approximately normal, whatever the shape of the population they come from.
sample proportion: The share p̂ of a sample with some feature, such as being unemployed; its mean is p and its standard error √(p(1 − p)/n).
finite population correction: The factor √((N − n)/(N − 1)) that reduces the standard error when a sample takes a large share of a finite population.
Markov's inequality: For a quantity that is never negative, the chance that it reaches a level a is at most its mean divided by a.
Chebyshev's inequality: For any distribution, the chance of landing k or more standard deviations from the mean is at most 1/k², so at least 1 − 1/k² lies within k standard deviations.
sample mean: The average X̄ of n independent draws from a distribution; it has the same mean μ as one draw and variance σ²/n.
law of large numbers: The result that the average of many independent draws gets ever closer to the true mean as the number of draws grows.
risk pooling: Combining many independent risks so that the average loss per unit becomes predictable even though each single loss is not.
estimator: A rule that turns sample data into a guess for an unknown population number, such as the sample mean for the population mean; the number it gives is the estimate.
unbiased estimator: An estimator whose average over all possible samples equals the true value, such as the sample variance with divisor n − 1.
confidence interval: A range computed from a sample by a method that covers the true value in a stated share of samples, such as 95 %.
margin of error: The half-width of a confidence interval, such as z·σ/√n for a mean; the interval is the estimate plus or minus this amount.
t distribution: A bell-shaped distribution with fatter tails than the normal, used for intervals when σ is estimated by s; it has n − 1 degrees of freedom for a mean.
null hypothesis: The statement that nothing has changed (for example μ = μ₀), which a test assumes true and rejects only if the data would be very unlikely under it.
p-value: The probability, computed assuming the null hypothesis is true, of a test statistic at least as extreme as the one observed.
significance level: The probability α of rejecting a true null hypothesis that a test accepts, chosen in advance, usually 5 %.
type I and type II errors: Rejecting a null hypothesis that is true (type I) and failing to reject one that is false (type II).
power of a test: The probability that a test rejects the null hypothesis when it is false, equal to 1 minus the probability of a type II error.
Markov chain: A model in which something moves between a few states from period to period, with chances of moving that depend only on the current state.
Markov property: The rule that the chance of the next state depends only on the state now, not on how the process got there.
stationary distribution: The shares of the states that a Markov chain keeps unchanged from one period to the next, found by solving πP = π with the shares adding up to 1.
regular Markov chain: A chain in which some power of the transition matrix has every entry positive, so the shares approach the same long-run distribution from any start.
absorbing state: A state that can never be left once entered, such as default in a credit-rating model.
median: The middle value of a data set sorted by size (the average of the two middle values when n is even); unlike the mean, it hardly moves when one value becomes extreme.
interquartile range: The upper quartile minus the lower quartile, Q3 − Q1, the width of the middle half of the data.
coefficient of variation: The standard deviation divided by the mean, usually in per cent, used to compare spread across data sets with different units or levels.
right-skewed: Describes data with a long tail of a few very large values, such as incomes or house prices, so that the mean lies above the median.
outlier: An observation far from the rest of the data; in a box plot, a value more than 1.5 × IQR below Q1 or above Q3.
price index: A number showing how the cost of a fixed basket of goods has changed relative to a base period, which is set to 100.
consumer price index (CPI): A price index for the basket of goods and services bought by households, weighted by their shares of household spending; its percentage change is the inflation rate.
Laspeyres price index: A price index that weights prices by base-period quantities, Σp₁q₀ ÷ Σp₀q₀ × 100; it tends to overstate the rise in the cost of living.
Paasche price index: A price index that weights prices by current-period quantities, Σp₁q₁ ÷ Σp₀q₁ × 100; it tends to understate the rise in the cost of living.
real wage: A money wage divided by a price index (× 100), showing what the wage can buy in base-year prices.
chain index: A value compared with the value of the period just before it, usually written in per cent (previous period = 100).
base index: A value compared with its value in one fixed base period (base period = 100); it equals the product of the chain indices since the base period.
percentage point: The unit for the difference between two rates; a rate falling from 6 % to 4.5 % falls by 1.5 percentage points.
annualised growth rate: The yearly rate a quarterly or monthly growth rate would give if it continued for a whole year, (1 + q)⁴ − 1 or (1 + m)¹² − 1.
year-on-year growth rate: Growth compared with the same period one year earlier, for example this quarter against the same quarter last year.
residual: The gap between an observed value and the value a fitted line predicts for it, y − ŷ; the part the line does not explain.
least squares: The method that picks the regression line making the sum of the squared residuals as small as possible.
coefficient of determination: R², the share of the variation of y around its mean that a regression explains, 1 − SSR/SST, between 0 and 1.
extrapolation: Using a fitted relationship to predict outside the range of the data it was estimated from, where it may no longer hold.
linear programme: An optimisation problem with a linear objective, linear inequality constraints and non-negative decision variables.
feasible region: The set of all plans that satisfy every constraint of an optimisation problem at once.
binding constraint: A constraint that holds with equality at a given plan, so the resource it describes is fully used.
slack variable: A non-negative variable that measures the unused amount of a ≤ constraint and turns it into an equation.
simplex method: A step-by-step method for linear programmes that moves from corner to neighbouring corner of the feasible region, raising the objective each time until no neighbour is better.
transportation problem: A linear programme that chooses how much to ship from each source to each destination so that supplies and demands are met at the lowest total shipping cost.
dummy source or destination: An extra row or column with zero costs added to balance supply and demand; its shipments show unused capacity or unmet demand.
north-west corner rule: A way to build a starting shipping plan by filling the table from the top-left cell, moving right or down, without looking at costs.
Vogel's approximation method: A starting rule that first serves the row or column with the largest penalty, the gap between its two cheapest costs.
reduced cost: For an unused route, the true unit cost minus the cost implied by the current plan's potentials (cᵢⱼ − uᵢ − vⱼ); a negative value means using the route would lower the total cost.
dual problem: The linear programme paired with a given one, which prices each constraint's resource and minimises the total value of the resources while every product's resources are worth at least its profit.
weak duality: Any feasible value of the dual (minimisation) problem is at least as large as any feasible value of the primal (maximisation) problem.
strong duality: When a linear programme has an optimal solution, its dual has one too and the two optimal values are equal.
complementary slackness: At the optimum a resource with spare units has shadow price zero, and a product that is made earns exactly the value of the resources it uses.
opportunity loss: In a linear programme, the value of the resources a product uses at the shadow prices minus its profit; a product with a positive opportunity loss is not made.
Nash equilibrium: A choice of strategy for each player such that no player can gain by changing their own strategy while the others keep theirs.
best response: The strategy that gives a player the highest payoff against a given strategy of the other player.
dominant strategy: A strategy that gives a player a higher payoff than any other strategy, whatever the other players do.
Pareto efficient: An outcome where no one can be made better off without making someone else worse off.
Cournot duopoly: A market with two firms that choose their output quantities at the same time, each taking the rival's output as given.
integer programming: A linear programme in which some or all variables must take whole-number values, such as numbers of machines or yes/no decisions.
LP relaxation: The linear programme obtained by dropping the whole-number conditions of an integer programme; its optimal value bounds the integer optimum.
branch and bound: A method for integer programmes that splits the problem on a fractional variable (x ≤ k or x ≥ k + 1) and discards branches whose LP bound cannot beat the best whole plan found so far.
price of integrality: The LP-relaxation optimum minus the best whole-number value; what indivisibility costs.
fractional-linear programming: Maximising a ratio of two linear functions, such as profit per unit of cost, subject to linear constraints; the optimum is at a corner.
mixed strategy: A plan in which a player chooses among their possible actions at random, with fixed probabilities.
indifference principle: In a mixed-strategy equilibrium each player mixes so that the other player gets the same expected payoff from every action they use.
best-response correspondence: For each strategy of the opponent, the set of a player's strategies that give the highest expected payoff; with mixed strategies it can be a whole interval.
Nash's theorem: Every game with finitely many players and pure strategies has at least one Nash equilibrium, possibly in mixed strategies.
input–output table: A table of an economy showing how much each sector sells to every other sector as inputs and to final users.
technical coefficient: The input from one sector needed per unit of another sector's output, a_ij = z_ij / x_j.
Leontief inverse: The matrix (I − A)⁻¹ whose entries give the total direct and indirect output each sector must produce per unit of final demand for each good.
output multiplier: The column sum of the Leontief inverse; the extra output of the whole economy per unit of extra final demand for one sector's good.
final demand: Purchases of goods for final use (households, government, investment and exports) rather than as inputs to production.
zero-sum game: A game between two players in which whatever one player wins the other loses, so a single payoff table describes both.
value of a game: The expected payoff that the row player can guarantee and the column player can hold them to when both play optimally in a zero-sum game.
maximin: The largest of a player's worst-case payoffs; the most a cautious player can guarantee with a pure strategy.
saddle point of a game: An entry of a zero-sum payoff matrix that is the smallest in its row and the largest in its column, so pure strategies already solve the game.
minimax theorem: Von Neumann's result that in every finite zero-sum game the row player's best guarantee equals the column player's best limit once mixed strategies are allowed.
critical path: The longest chain of activities from the start to the end of a project; its length is the project duration and its activities have zero total float.
total float: How long an activity can be delayed without delaying the whole project, latest start minus earliest start (also called slack).
free float: How long an activity can be delayed without delaying the earliest start of any activity that follows it.
crashing: Shortening a critical activity at extra cost, such as overtime or more workers, so that a project finishes sooner.
directed graph: A set of points (vertices) joined by arrows (directed edges), used for example to show which activities must come before which.
design matrix: The n × k matrix X of a regression, one row per observation and one column per coefficient, whose first column of ones carries the intercept.
normal equations: The equations XᵀX·b = Xᵀy that the least-squares coefficients solve, obtained by setting the derivatives of the sum of squared residuals to zero.
perfect multicollinearity: A situation in which one regressor is an exact linear combination of the others, so XᵀX has no inverse and OLS cannot separate their effects.
dummy variable trap: Including a dummy for every group together with an intercept; the dummies add up to the column of ones, causing perfect multicollinearity.
adjusted R²: R² corrected for the number of coefficients, 1 − (1 − R²)(n − 1)/(n − k), which can fall when a useless regressor is added.
Poisson process: Arrivals that occur one at a time, independently, at a steady average rate λ, so the number in any interval of length t is Poisson with mean λt.
exponential distribution: The distribution of the waiting time between events of a Poisson process, with P(T > t) = e^(−λt) and mean 1/λ; it has no memory.
utilisation: The share of time a server is busy, ρ = λ/(cμ); a queue settles down only if ρ < 1.
Little's law: In any queue in a steady state, the average number inside equals the arrival rate times the average time each customer stays, L = λW.
Erlang C formula: The probability that a customer arriving at an M/M/c queue has to wait because all c servers are busy.
homoskedasticity: The errors of a regression have the same variance whatever the values of the regressors, Var(u | X) = σ²I.
zero conditional mean: The assumption E[u | X] = 0 that the error does not move, on average, with the regressors; it makes OLS unbiased.
Gauss–Markov theorem: Under the classical assumptions with homoskedastic, uncorrelated errors, OLS has the smallest variance among all linear unbiased estimators (it is BLUE).
omitted-variable bias: The bias β₂δ₁ in a regression slope when a variable that affects y and moves with an included regressor is left out.
consistent estimator: An estimator that gets arbitrarily close to the true value, with probability approaching 1, as the sample grows.
difference equation: A rule that gives each period's value of a variable from its value in earlier periods, such as y(t+1) = a·y(t) + b.
steady state: A value that a dynamic rule turns into itself, so once the variable reaches it, it stays there; for y(t+1) = a·y(t) + b it is b/(1 − a).
cobweb model: A market model in which producers decide supply from last period's price, so prices can swing above and below equilibrium from one period to the next.
primary deficit: Government spending minus tax revenue, leaving out interest payments on existing debt.
F distribution: The right-skewed distribution of a ratio of two independent variance estimates, written F(q, v); it is the distribution of the F statistic when the restrictions being tested are true.
F test: A test of several restrictions on regression coefficients at once, comparing the sums of squared residuals of the restricted and unrestricted regressions.
restricted regression: The regression re-estimated with the null hypothesis imposed, for example with some variables left out; its SSR is never below that of the unrestricted regression.
joint hypothesis: A null hypothesis that makes claims about several coefficients at the same time, such as that three regional dummies are all zero.
economic significance: Whether an estimated effect is large enough to matter in practice, judged by its size and units rather than by its t statistic.
value function: The best total payoff that can still be achieved from a given stage and state onwards, if every later decision is made optimally.
Bellman equation: The rule that links values at successive stages; the value of a state is the best, over today's choices, of today's payoff plus the discounted value of the state that choice leads to.
principle of optimality: Whatever has happened so far, the remaining part of an optimal plan must itself be optimal from the current state.
backward induction: Solving a multi-stage problem from the last stage back to the first, so each decision is made knowing the best continuation.
reservation wage: The lowest wage offer an unemployed worker will accept; offers below it are rejected in the hope of a better one.
heteroskedasticity: The errors of a regression have different variances for different observations, for example a wider spread of food spending among rich households than among poor ones.
autocorrelation: Correlation between the errors of a time-series regression in different periods, so that a shock in one period carries over into the next; also called serial correlation.
Breusch–Pagan test: A test of constant error variance that regresses the squared residuals on the regressors and compares n·R² with a χ² critical value.
Durbin–Watson statistic: d = Σ(eₜ − eₜ₋₁)²/Σeₜ², roughly 2(1 − ρ̂); values well below 2 point to positive autocorrelation of the errors.
robust standard error: A standard error that stays valid when the error variance differs between observations, computed from each observation's own squared residual (White); the Newey–West version also allows for autocorrelation.
white noise: A series of random shocks with mean 0, the same variance every period and no correlation between different periods.
stationary time series: A time series whose mean, variance and autocovariances stay the same over time, so the link between two values depends only on how many periods apart they are.
random walk: A series in which each value is the previous one plus a random shock, so shocks never fade and the variance keeps growing over time.
unit root: The case φ = 1 in yₜ = c + φyₜ₋₁ + εₜ, which turns a series into a random walk; taking first differences removes it.
convex set: A set that contains the whole straight segment between any two of its points, so it has no dents or holes.
quasiconcave function: A function whose upper level sets (all points where it is at least c) are convex sets, so a mix of two points is at least as good as the worse of them.
upper level set: All the points where a function is greater than or equal to a given value c, such as everything on or above an indifference curve.
bordered Hessian: The Hessian matrix framed by a row and column of first partial derivatives; in two variables its determinant decides whether level curves bow towards the origin.
diminishing marginal rate of substitution: The MRS falls as a consumer moves along an indifference curve towards more of one good, which happens when the curve bows towards the origin.
Lagrangian: The function f − λ(g − c) that combines an objective with a constraint so that a constrained optimum can be found from first-order conditions.
Lagrange multiplier: The extra unknown λ in a Lagrangian; at the optimum it is the ratio of the objective's gradient to the constraint's gradient.
tangency condition: At the best choice on a budget the indifference curve just touches the budget line, so the MRS equals the price ratio (for a firm, the MRTS equals w/r).
Kuhn–Tucker conditions: The first-order conditions for optimisation with inequality constraints and non-negative variables; stationarity of the Lagrangian, non-negative multipliers and complementary slackness.
corner solution: An optimum where one or more choice variables are zero, for example a consumer who buys none of a good.
quasilinear utility: A utility function of the form v(x) + y, linear in one good, so demand for x does not depend on income unless income is very low.
rationing: A limit on how much of a good each person may buy, which changes choices only when the limit binds.
non-negativity constraint: The requirement that a choice variable such as a quantity cannot be negative, x ≥ 0.
marginal utility of income: The extra maximum utility a consumer gets from one more unit of income; the Lagrange multiplier of the budget constraint.
optimal value function: The best value of an objective, such as maximum utility or minimum cost, written as a function of a constraint's constant or another parameter.
non-binding constraint: A constraint that is not used up at the optimum, so relaxing it does not change the best value and its shadow price is zero.
amortisation schedule: A table showing, payment by payment, how much of each loan instalment is interest and how much repays the loan, and the balance left afterwards.
principal: The amount borrowed and still owed on a loan, as opposed to the interest charged on it.
residual value: The expected value of a leased asset when it is handed back at the end of the lease.
APR (annual percentage rate): The yearly cost of a loan that lenders must quote, including compulsory fees, so that offers can be compared.
equal-principal loan: A loan repaid with the same amount of principal each period plus interest on the balance, so the payments fall over time.
net present value: The value today of all of a project's future cash flows minus its initial cost; a positive NPV means the project adds value.
internal rate of return: The discount rate at which a project's net present value is exactly zero; the rate of return the project itself earns.
payback period: The number of years until a project's undiscounted cash flows add up to its initial cost.
crossover rate: The discount rate at which two projects have the same net present value; on one side of it the NPV and IRR rankings conflict.
opportunity cost of capital: The return the money could earn elsewhere at similar risk, used as the discount rate when appraising an investment.
bond: A tradable loan in which the issuer promises fixed payments (coupons) and the repayment of the face value on a set maturity date.
coupon: The fixed yearly payment on a bond, equal to the coupon rate times the face value.
face value: The amount a bond repays at maturity, also called par value; bond prices are usually quoted per 100 of it.
yield to maturity: The single discount rate at which the present value of a bond's remaining payments equals its price.
current yield: A bond's yearly coupon divided by its current price; it ignores the gain or loss when the face value is repaid.
total differential: The estimated change dz = f_x·dx + f_y·dy in a function of several variables when all its inputs change by small amounts, each partial derivative times its own change, added up.
multivariable chain rule: The rule dz/dt = f_x·dx/dt + f_y·dy/dt for how fast z = f(x, y) changes when x and y both move over time; the effects through each variable add up.
budget share: The fraction of total spending that goes on one good, p_i·q_i divided by total spending; used as the weight of that good's price change in a price index.
Solow residual: The part of output growth not explained by the growth of capital and labour weighted by their shares; a measure of total factor productivity growth.
homogeneous function: A function with f(tx, ty) = t^k·f(x, y) for every t > 0, so scaling all inputs by t scales the value by t^k; k is its degree.
Euler's theorem: For a function homogeneous of degree k, x·f_x + y·f_y = k·f; for production, K·MP_K + L·MP_L = k·Q.
product exhaustion: Under constant returns to scale, paying every input its marginal product uses up exactly the whole output.
homothetic function: A function whose isoquants or indifference curves are enlarged copies of each other, so their slope is the same along any ray from the origin.
money illusion: Mistaking changes in nominal prices and income for real changes; demand homogeneous of degree 0 means there is none.
implicit function theorem: If F(x, y) = 0 at a point and F_y is not zero there, the equation defines y as a differentiable function of x near that point, with dy/dx = −F_x/F_y.
Jacobian: The matrix of the first partial derivatives of a system of equations with respect to its unknowns; if its determinant is not zero, the solution changes smoothly with the parameters.
endogenous variable: A variable whose value is determined inside an economic model, such as an equilibrium price.
exogenous variable: A variable set outside an economic model and taken as given, such as income or a tax rate.
crowding out: The fall in private investment when higher government spending raises the interest rate, which makes the spending multiplier smaller.
