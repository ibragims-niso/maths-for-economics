<!doctype html>
<html lang="en">
  <head>

      content="Free, offline-first app that teaches the mathematics of an economics degree."

    <meta name="theme-color" content="#FBFCFD" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
